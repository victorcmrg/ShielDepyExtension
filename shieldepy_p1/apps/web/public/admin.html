<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel admin — ShielDepy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-require-admin data-page="platform">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu"></aside>
    <div class="side-scrim" id="sideScrim"></div>
    <div class="app-main">
      <header class="topbar"><button id="menuToggle" class="icon-btn" type="button" aria-label="Abrir menu"></button><span class="topbar-title">Plataforma</span></header>

  <main id="main" class="page gated-hidden">
    <section class="page-head spaced">
      <div>
        <h1 class="page-title">Plataforma</h1>
        <p class="page-sub">As empresas que usam o ShielDepy. Crie a empresa com o dono, e ele monta os projetos e a equipe. Aqui você libera ou suspende o acesso e a IA.</p>
      </div>
      <button id="newCompanyBtn" class="btn-brand" type="button"></button>
    </section>

    <section class="stat-grid" id="stats">
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
      <div class="stat-card skeleton"></div>
    </section>

    <section class="dash-section">
      <div class="dash-section-head">
        <h2>Empresas</h2>
        <label class="search-box">
          <span id="searchIcon"></span>
          <input type="search" id="search" placeholder="Buscar empresa ou e-mail…" autocomplete="off" />
        </label>
      </div>
      <div id="companies" class="company-list">
        <div class="company-row skeleton"></div>
        <div class="company-row skeleton"></div>
      </div>
    </section>
  </main>
    </div>
  </div>

  <script src="/dashboard.js"></script>
  <script src="/auth-gate.js"></script>
  <script src="/shell.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
