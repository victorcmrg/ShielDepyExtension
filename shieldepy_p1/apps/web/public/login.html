<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — ShielDepy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-page-inner">
      <div class="auth-logo">
        <img src="/logo-mark.svg" alt="" />
        <span>ShielDepy</span>
      </div>

      <div class="auth-card">
        <h1>Entrar na conta</h1>
        <p class="muted">Conecte sua conta à extensão ShielDepy.</p>

        <div id="errorBox" class="error-box hidden"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="voce@empresa.com" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button type="submit" class="primary" id="submitBtn">Entrar</button>
        </form>

        <div class="divider">ou continue com</div>
        <div class="oauth-row">
          <a id="googleBtn" class="btn-secondary" href="/api/auth/oauth/google/start">Google</a>
          <a id="githubBtn" class="btn-secondary" href="/api/auth/oauth/github/start">GitHub</a>
        </div>
      </div>

      <a class="back-link" href="/">← Voltar para o início</a>
    </div>
  </div>

  <script src="/login.js"></script>
</body>
</html>
