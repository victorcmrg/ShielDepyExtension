<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equipe — ShielDepy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/style.css" />
  <script src="/theme.js"></script>
</head>
<body data-page="team" data-require-owner>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu"></aside>
    <div class="side-scrim" id="sideScrim"></div>
    <div class="app-main">
      <header class="topbar"><button id="menuToggle" class="icon-btn" type="button" aria-label="Abrir menu"></button><span class="topbar-title">Equipe</span></header>

      <main id="main" class="page gated-hidden">
        <section class="page-head">
          <div>
            <h1 class="page-title">Equipe</h1>
            <p class="page-sub">Quem é da empresa, em quais projetos trabalha e quem pode administrar. Só quem está num projeto usa a extensão nos repositórios dele.</p>
          </div>
          <button id="invite" class="btn-brand" type="button">Convidar pessoa</button>
        </section>

        <div class="toolbar">
          <label class="search-box">
            <span class="sr-only">Pesquisar</span>
            <input id="search" type="text" placeholder="Pesquisar por e-mail…" autocomplete="off" />
          </label>
        </div>

        <ul class="team-rows" id="rows"></ul>
        <p class="page-foot" id="foot"></p>
      </main>
    </div>
  </div>

  <script src="/dashboard.js"></script>
  <script src="/auth-gate.js"></script>
  <script src="/shell.js"></script>
  <script src="/team.js"></script>
</body>
</html>
